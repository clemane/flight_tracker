services:
  app:
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./scrappervol:/app/scrappervol
      - ./tests:/app/tests
      # Monté comme le code : sans cela les scripts exécutés dans le conteneur seraient ceux
      # figés dans l'image au dernier build, pas ceux du dépôt.
      - ./scripts:/app/scripts
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
